<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanShot W — Seven-Segment Instrument</title>
<style>
  @import url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css");
  :root {
    --ground: #0b0c0e;
    --cell: #131519;
    --cell-line: #22262d;
    --ghost: rgba(255, 255, 255, 0.055);
    --text: #dfe3ea;
    --muted: #79818f;
    --green: #3fe081;
    --amber: #ffb224;
    --red: #ff4d3d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--text);
    font: 13px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  .slot-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .seg {
    font-family: "DSEG7 Classic", monospace; font-style: italic;
    color: var(--green); text-shadow: 0 0 10px rgba(63,224,129,0.45);
  }
  .seg.ghosted span.off { color: var(--ghost); text-shadow: none; }

  /* every panel is a mask of cells */
  .mask { display: grid; background: var(--cell); border: 1px solid var(--cell-line); }
  .cellbtn { display: grid; place-items: center; min-width: 40px; height: 38px;
    background: none; border: 1px solid var(--cell-line); margin: -0.5px; cursor: pointer;
    color: var(--muted); position: relative; }
  .cellbtn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .cellbtn.lit { color: var(--green);
    box-shadow: inset 0 0 0 1px var(--green), inset 0 0 14px rgba(63,224,129,0.16); }
  .cellbtn.lit::after { content: ""; position: absolute; top: 3px; right: 3px; width: 4px; height: 4px;
    border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(63,224,129,0.9); }
  .cellbtn.warm.lit { color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber), inset 0 0 14px rgba(255,178,36,0.15); }
  .cellbtn.warm.lit::after { background: var(--amber); box-shadow: 0 0 6px rgba(255,178,36,0.9); }
  svg.ic { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Header mask ───────────────────────────────── */
  .head { flex: 0 0 auto; display: flex; align-items: stretch; gap: 0; margin: 12px 14px 0; }
  .head > div { padding: 8px 12px 10px; display: grid; gap: 6px; justify-items: start; }
  .head > div + div { border-left: 1px solid var(--cell-line); }
  .brand-cell strong { font-size: 13px; letter-spacing: 0.02em; }
  .brand-cell small { color: var(--muted); font-size: 10px; letter-spacing: 0.14em; }
  .spacer { flex: 1; background: none; border-left: 0 !important;
    background-image:
      linear-gradient(var(--cell-line) 1px, transparent 1px),
      linear-gradient(90deg, transparent calc(100% - 1px), var(--cell-line) 0);
    background-size: 28px 100%, 28px 100%; opacity: 0.6; }
  .mode-btn { min-width: 52px; height: 30px; border: 1px solid var(--cell-line); background: none; cursor: pointer;
    color: var(--muted); font: 700 9.5px/1 inherit; letter-spacing: 0.16em; text-transform: uppercase; }
  .mode-btn.lit { color: var(--green); border-color: var(--green); box-shadow: inset 0 0 10px rgba(63,224,129,0.14); }
  .dims { font-size: 19px; letter-spacing: 0.06em; }
  .copy-btn { height: 34px; padding: 0 16px; border: 1px solid var(--green); background: rgba(63,224,129,0.1);
    color: var(--green); cursor: pointer; font: 700 11px/1 inherit; letter-spacing: 0.18em; text-transform: uppercase;
    box-shadow: inset 0 0 12px rgba(63,224,129,0.12); }
  .quiet-btn { height: 34px; padding: 0 12px; border: 1px solid var(--cell-line); background: none; color: var(--text);
    cursor: pointer; font: 700 10px/1 inherit; letter-spacing: 0.14em; text-transform: uppercase; }
  .quiet-btn:hover { border-color: var(--muted); }

  /* ── Stage ─────────────────────────────────────── */
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding-bottom: 96px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 56px),
      radial-gradient(60vw 40vh at 50% 44%, #101318, var(--ground) 75%);
  }
  .shot-mask { position: relative; outline: 1px solid var(--cell-line); outline-offset: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.65); }
  .corner-ticks i { position: absolute; width: 14px; height: 14px; border-color: var(--green); border-style: solid; opacity: 0.85; }
  .corner-ticks i:nth-child(1) { top: -12px; left: -12px; border-width: 1px 0 0 1px; }
  .corner-ticks i:nth-child(2) { top: -12px; right: -12px; border-width: 1px 1px 0 0; }
  .corner-ticks i:nth-child(3) { bottom: -12px; left: -12px; border-width: 0 0 1px 1px; }
  .corner-ticks i:nth-child(4) { bottom: -12px; right: -12px; border-width: 0 1px 1px 0; }
  .shot { width: 550px; max-width: 56vw; background: #fff; user-select: none; }
  .shot-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #e8eaed; border-bottom: 1px solid #d5d8dd; }
  .shot-bar b { width: 9px; height: 9px; border-radius: 50%; background: #c4c8ce; }
  .shot-bar em { font-style: normal; font-size: 11px; color: #5f6368; margin-left: 6px; }
  .shot-body { display: flex; }
  .shot-side { width: 90px; padding: 12px 10px; display: grid; gap: 8px; align-content: start; background: #f4f5f7; border-right: 1px solid #e3e5e9; }
  .shot-side i { height: 7px; border-radius: 3px; background: #d9dce1; }
  .shot-doc { flex: 1; padding: 16px 18px; display: grid; gap: 9px; align-content: start; }
  .shot-doc h4 { margin: 0 0 2px; height: 12px; width: 46%; border-radius: 3px; background: #9aa0a6; }
  .shot-doc p { margin: 0; height: 7px; border-radius: 3px; background: #e0e2e6; }
  .anno { position: absolute; inset: 0; pointer-events: none; }
  .counter-seg { position: absolute; bottom: -20px; right: -26px; width: 44px; height: 44px; background: var(--cell);
    border: 1px solid var(--cell-line); display: grid; place-items: center; font-size: 21px; }

  /* ── Tool mask dock ────────────────────────────── */
  .dock { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: stretch; }
  .bank { padding: 9px 12px 11px; display: grid; gap: 7px; justify-items: start; }
  .bank + .bank { border-left: 1px solid var(--cell-line); }
  .swatch { width: 18px; height: 18px; border: 1px solid var(--cell-line); background: none; cursor: pointer; padding: 0; }
  .swatch.lit { box-shadow: 0 0 0 1.5px var(--green), 0 0 8px rgba(63,224,129,0.5); }
  .width-cell i { display: block; width: 15px; border-radius: 1px; background: currentColor; }

  /* ── Settings mask ─────────────────────────────── */
  .setup { position: fixed; top: 84px; right: 16px; width: 330px; z-index: 20; }
  .srow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 14px;
    border-bottom: 1px solid var(--cell-line); }
  .srow b { font-size: 12.5px; font-weight: 600; display: block; }
  .srow small { color: var(--muted); font-size: 11px; line-height: 1.4; }
  .hotkey-cells { display: inline-flex; gap: 4px; }
  .hk { min-width: 34px; height: 30px; padding: 0 8px; display: grid; place-items: center;
    border: 1px solid var(--cell-line); color: var(--green); background: rgba(63,224,129,0.05);
    font: 700 9.5px/1 Consolas, monospace; letter-spacing: 0.1em; }
  .bit { width: 42px; height: 20px; border: 1px solid var(--cell-line); display: grid; place-items: center; cursor: pointer; }
  .bit i { width: 32px; height: 8px; background: var(--ghost); }
  .bit.on i { background: var(--green); box-shadow: 0 0 8px rgba(63,224,129,0.6); }
</style>
</head>
<body>

<header class="head mask">
  <div class="brand-cell"><strong>CleanShot W</strong><small>UNIT 01 · EDIT CHANNEL</small></div>

  <div>
    <span class="slot-label">Mode</span>
    <div style="display:flex;gap:4px">
      <button class="mode-btn">Area</button>
      <button class="mode-btn">Win</button>
      <button class="mode-btn">Full</button>
    </div>
  </div>

  <div style="flex-direction:row;display:flex;align-items:center;gap:4px;padding-top:14px">
    <button class="cellbtn" disabled style="opacity:.35"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="cellbtn"><svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>

  <span class="spacer"></span>

  <div style="justify-items:end">
    <span class="slot-label">Frame size</span>
    <span class="seg dims ghosted"><span>1280×800</span></span>
  </div>

  <div style="padding-top:16px;flex-direction:row;display:flex;gap:6px">
    <button class="quiet-btn">OCR</button>
    <button class="quiet-btn">Pin</button>
    <button class="copy-btn">Copy ⏎</button>
    <button class="quiet-btn">Save</button>
  </div>

  <div style="padding-top:16px;flex-direction:row;display:flex;gap:4px">
    <button class="cellbtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></button>
    <button class="cellbtn lit warm"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.5-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg></button>
  </div>
</header>

<main class="stage">
  <div class="shot-mask">
    <span class="corner-ticks"><i></i><i></i><i></i><i></i></span>
    <div class="shot">
      <div class="shot-bar"><b></b><b></b><b></b><em>Quarterly Report — Draft.docx</em></div>
      <div class="shot-body">
        <div class="shot-side"><i style="width:80%"></i><i style="width:65%"></i><i style="width:74%"></i><i style="width:58%"></i><i style="width:70%"></i></div>
        <div class="shot-doc">
          <h4></h4>
          <p style="width:96%"></p><p style="width:88%"></p><p style="width:93%"></p>
          <p style="width:64%"></p>
          <p style="width:91%"></p><p style="width:85%"></p>
        </div>
      </div>
      <svg class="anno" viewBox="0 0 550 340">
        <defs><marker id="ah8" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#3fe081"/></marker></defs>
        <path d="M148 235 C 215 195, 252 158, 320 130" fill="none" stroke="#3fe081" stroke-width="4" marker-end="url(#ah8)" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="counter-seg seg ghosted"><span>1</span></span>
  </div>

  <!-- Tool mask -->
  <div class="dock mask">
    <div class="bank">
      <span class="slot-label">Cursor</span>
      <div style="display:flex;margin:-0.5px">
        <button class="cellbtn lit" title="Select"><svg class="ic" viewBox="0 0 24 24"><path d="m5 3 7 17 2.5-6.5L21 11z"/></svg></button>
      </div>
    </div>
    <div class="bank">
      <span class="slot-label">Shapes</span>
      <div style="display:flex;margin:-0.5px">
        <button class="cellbtn" title="Arrow"><svg class="ic" viewBox="0 0 24 24"><path d="M5 19 19 5M19 5h-8M19 5v8"/></svg></button>
        <button class="cellbtn" title="Rectangle"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
        <button class="cellbtn" title="Ellipse"><svg class="ic" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
      </div>
    </div>
    <div class="bank">
      <span class="slot-label">Mark</span>
      <div style="display:flex;margin:-0.5px">
        <button class="cellbtn warm lit" title="Pen"><svg class="ic" viewBox="0 0 24 24"><path d="m14 4 6 6L8 22l-6 1 1-6z"/></svg></button>
        <button class="cellbtn" title="Text"><svg class="ic" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
        <button class="cellbtn" title="Counter"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><text x="12" y="15.5" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" font-weight="700">2</text></svg></button>
        <button class="cellbtn" title="Highlighter"><svg class="ic" viewBox="0 0 24 24"><path d="m9 15-4 6h14"/><path d="M9 15 17 4l4 3-8 11z"/></svg></button>
      </div>
    </div>
    <div class="bank">
      <span class="slot-label">FX</span>
      <div style="display:flex;margin:-0.5px">
        <button class="cellbtn" title="Blur"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" stroke-dasharray="2 3"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="cellbtn" title="Pixelate"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
      </div>
    </div>
    <div class="bank">
      <span class="slot-label">Ink / weight</span>
      <div style="display:flex;align-items:center;height:38px;gap:8px;margin-top:1px">
        <button class="swatch lit" style="background:#3fe081"></button>
        <button class="swatch" style="background:#ff4d3d"></button>
        <button class="swatch" style="background:#ffb224"></button>
        <button class="swatch" style="background:#ffffff"></button>
        <button class="swatch" style="background:#111318"></button>
        <span style="width:1px;height:22px;background:var(--cell-line)"></span>
        <button class="cellbtn width-cell" style="min-width:30px;width:30px"><i style="height:2px"></i></button>
        <button class="cellbtn width-cell lit" style="min-width:30px;width:30px"><i style="height:3.5px"></i></button>
        <button class="cellbtn width-cell" style="min-width:30px;width:30px"><i style="height:5px"></i></button>
      </div>
    </div>
  </div>

  <!-- Setup mask -->
  <section class="setup mask">
    <div style="padding:12px 14px;border-bottom:1px solid var(--cell-line);display:flex;justify-content:space-between;align-items:baseline">
      <strong style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase">Setup cells</strong>
      <span class="slot-label">stored locally</span>
    </div>
    <div class="srow">
      <div><b>Capture hotkey</b><small>Area capture from anywhere.</small></div>
      <span class="hotkey-cells"><span class="hk">CTRL</span><span class="hk">SHIFT</span><span class="hk">4</span></span>
    </div>
    <div class="srow">
      <div><b>Include cursor</b><small>Pointer shows in captures.</small></div>
      <span class="bit on"><i></i></span>
    </div>
    <div class="srow">
      <div><b>Run at startup</b><small>Waits in the tray.</small></div>
      <span class="bit"><i></i></span>
    </div>
    <footer style="display:flex;justify-content:flex-end;padding:11px 14px">
      <button class="copy-btn" style="height:30px;font-size:10px">Done</button>
    </footer>
  </section>
</main>

</body>
</html>
