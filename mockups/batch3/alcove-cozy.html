<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanShot W — Alcove Cozy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #101013;
    --canvas-tint: #16161c;
    --panel: #17171b;
    --raised: #1d1d22;
    --hover: #24242a;
    --hairline: rgba(255,255,255,.07);
    --accent: #ff8f70;
    --accent-soft: rgba(255,143,112,.16);
    --white: #ffffff;
    --t60: rgba(255,255,255,.6);
    --t35: rgba(255,255,255,.35);
    --r-btn: 8px;
    --r-card: 12px;
    --r-bar: 14px;
    --spring: cubic-bezier(.34,1.56,.64,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    font-weight: 500;
    background:
      radial-gradient(1100px 700px at 50% 38%, var(--canvas-tint) 0%, transparent 62%),
      var(--canvas);
    color: var(--white);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  button { font-family: inherit; font-weight: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-btn);
  }

  /* ---------- Top bar ---------- */

  .topbar {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    height: 52px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: var(--r-card);
    box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.03) inset;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 10px 0 14px;
    z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 9px; margin-right: 4px; }
  .brand-glyph {
    width: 24px; height: 24px;
    border-radius: 7px;
    background: linear-gradient(160deg, #2a2a31, #202027);
    border: 1px solid rgba(255,255,255,.09);
    display: grid; place-items: center;
  }
  .brand-name { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .brand-name span { color: var(--t35); font-weight: 500; margin-left: 5px; font-size: 11px; }

  .seg-tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px;
  }
  .seg-tabs button {
    font-size: 12px;
    color: var(--t60);
    padding: 4px 12px;
    border-radius: 999px;
    transition: background 140ms ease-out, color 140ms ease-out;
  }
  .seg-tabs button:hover { color: var(--white); }
  .seg-tabs button.on {
    background: var(--raised);
    color: var(--white);
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .dot-edit {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 6px;
    vertical-align: middle;
    transform: translateY(-1px);
  }

  .icon-btn {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: var(--r-btn);
    color: var(--t60);
    transition: background 120ms ease-out, color 120ms ease-out, transform 120ms ease-out;
  }
  .icon-btn:hover { background: var(--hover); color: var(--white); transform: translateY(-1px); }
  .icon-btn:disabled { opacity: .35; cursor: default; transform: none; background: none; }
  .icon-sep { width: 1px; height: 20px; background: var(--hairline); margin: 0 2px; }

  .spacer { flex: 1; }

  .sparkline { display: flex; align-items: center; gap: 4px; margin-right: 4px; }
  .sparkline i {
    height: 14px;
    background: var(--hover);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    animation: spark-in 480ms ease-out backwards;
  }
  .sparkline i:nth-child(1) { width: 13px; opacity: .35; animation-delay: 80ms; }
  .sparkline i:nth-child(2) { width: 18px; opacity: .45; animation-delay: 140ms; }
  .sparkline i:nth-child(3) { width: 15px; opacity: .58; animation-delay: 200ms; }
  .sparkline i:nth-child(4) { width: 21px; opacity: .72; animation-delay: 260ms; }
  .sparkline i:nth-child(5) { width: 17px; background: rgba(255,255,255,.14); opacity: 1; animation-delay: 320ms; }
  @keyframes spark-in {
    from { opacity: 0; transform: scale(.7) translateY(3px); }
    to   { opacity: 1; transform: none; }
  }

  .chip-dims {
    font-size: 11px;
    letter-spacing: .02em;
    color: var(--t60);
    background: rgba(255,255,255,.05);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 5px 11px;
    white-space: nowrap;
  }
  .chip-dims b { font-variant-numeric: tabular-nums; font-weight: 600; color: rgba(255,255,255,.78); }

  .ghost-pill {
    font-size: 12px;
    color: var(--t60);
    border: 1px solid var(--hairline);
    border-radius: var(--r-btn);
    padding: 5px 11px;
    transition: background 120ms ease-out, color 120ms ease-out;
  }
  .ghost-pill:hover { background: var(--hover); color: var(--white); }

  .btn-copy {
    font-size: 12.5px;
    font-weight: 600;
    color: #17171b;
    background: var(--white);
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06);
    transition: transform 120ms ease-out, box-shadow 120ms ease-out;
  }
  .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); }
  .btn-copy:active { transform: none; }

  /* ---------- Canvas ---------- */

  .stage {
    position: absolute;
    inset: 76px 12px 96px;
    display: grid;
    place-items: center;
  }

  .capture-wrap { position: relative; padding: 10px; }

  .capture-card {
    position: relative;
    width: 560px;
    border-radius: 10px;
    overflow: hidden;
    background: #fdfdfc;
    box-shadow:
      0 30px 60px rgba(0,0,0,.55),
      0 8px 40px rgba(255,190,160,.07),
      0 0 0 1px rgba(255,255,255,.2);
  }

  /* selection ring + handles */
  .sel-ring {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    box-shadow: 0 0 0 2px rgba(255,143,112,.85), 0 0 24px rgba(255,143,112,.18);
    pointer-events: none;
  }
  .handle {
    position: absolute;
    width: 10px; height: 10px;
    background: var(--white);
    border: 1.5px solid var(--accent);
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
    z-index: 5;
  }
  .h-tl { top: 5px; left: 5px; }
  .h-tr { top: 5px; right: 5px; }
  .h-bl { bottom: 5px; left: 5px; }
  .h-br { bottom: 5px; right: 5px; }

  .win-titlebar {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    background: #f3f2f0;
    border-bottom: 1px solid rgba(0,0,0,.07);
  }
  .tdot { width: 10px; height: 10px; border-radius: 50%; }
  .tdot.r { background: #ff5f57; } .tdot.y { background: #febc2e; } .tdot.g { background: #28c840; }
  .win-title {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: rgba(0,0,0,.55);
  }

  .win-body { display: flex; height: 300px; }
  .win-side {
    width: 118px;
    background: #f6f5f3;
    border-right: 1px solid rgba(0,0,0,.06);
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .win-side i {
    display: block;
    height: 6px;
    border-radius: 3px;
    background: rgba(0,0,0,.1);
  }
  .win-side i:nth-child(1) { width: 82%; }
  .win-side i:nth-child(2) { width: 60%; }
  .win-side i:nth-child(3) { width: 74%; }
  .win-side i:nth-child(4) { width: 52%; }
  .win-side i:nth-child(5) { width: 68%; }

  .win-doc { flex: 1; padding: 26px 30px; background: #fffefd; }
  .doc-heading {
    width: 55%;
    height: 13px;
    border-radius: 4px;
    background: rgba(0,0,0,.72);
    margin-bottom: 18px;
  }
  .doc-line { height: 7px; border-radius: 3.5px; background: rgba(0,0,0,.14); margin-bottom: 12px; }
  .doc-line:nth-of-type(odd) { width: 92%; }
  .doc-line:nth-of-type(even) { width: 84%; }
  .doc-arrow-gap { height: 46px; }

  .arrow-layer { position: absolute; inset: 0; pointer-events: none; }

  .counter-badge {
    position: absolute;
    top: 118px; right: 132px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(255,143,112,.45), 0 0 0 3px rgba(255,255,255,.9);
  }

  /* ---------- Morphing capsule dock ---------- */

  .dock-zone {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    z-index: 20;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,.5));
  }

  .dock {
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 999px;
    padding: 6px;
    transition: border-radius 200ms var(--ease-out), padding 200ms var(--ease-out);
  }

  .dock-seg { display: flex; align-items: center; gap: 2px; }

  .tool {
    position: relative;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: 999px;
    color: var(--t60);
    transition: background 130ms ease-out, color 130ms ease-out, transform 130ms var(--ease-out);
  }
  .tool:hover { background: var(--hover); color: var(--white); transform: translateY(-1px); }
  .tool.on {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge-n {
    position: absolute;
    top: 2px; right: 2px;
    min-width: 13px; height: 13px;
    padding: 0 3px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-weight: 600;
    line-height: 13px;
    text-align: center;
  }

  .dock-divider {
    width: 1px;
    align-self: stretch;
    margin: 5px 8px;
    background: var(--hairline);
  }

  .dock-seg-b { padding-left: 4px; padding-right: 8px; gap: 8px; }

  .swatch {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14);
    transition: transform 130ms var(--ease-out);
  }
  .swatch:hover { transform: translateY(-1px) scale(1.1); }
  .swatch.sel {
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent);
    transform: scale(1.05);
  }
  .sw-coral { background: #ff8f70; }
  .sw-white { background: #f5f5f4; }
  .sw-yellow { background: #ffd166; }
  .sw-green { background: #7fd8a4; }
  .sw-blue { background: #7ab8f5; }

  .width-group {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 10px;
    border-left: 1px solid var(--hairline);
  }
  .width-dot {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 999px;
    transition: background 130ms ease-out, transform 130ms var(--ease-out);
  }
  .width-dot:hover { background: var(--hover); transform: translateY(-1px); }
  .width-dot i {
    display: block;
    border-radius: 50%;
    background: var(--t60);
  }
  .w-thin i { width: 3px; height: 3px; }
  .w-mid i { width: 6px; height: 6px; background: var(--white); }
  .w-mid { background: var(--hover); }
  .w-thick i { width: 10px; height: 10px; }

  /* ---------- Settings panel ---------- */

  .settings {
    position: absolute;
    top: 78px;
    right: 24px;
    width: 340px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    box-shadow: 0 24px 48px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    padding: 18px 18px 14px;
    z-index: 30;
  }
  .set-header { padding: 0 2px 14px; }
  .set-header h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .set-header p { font-size: 11px; color: var(--t35); margin-top: 3px; }

  .set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 2px;
    border-top: 1px solid var(--hairline);
  }
  .row-label { font-size: 13px; color: var(--white); }
  .row-hint { font-size: 11px; color: var(--t35); margin-top: 3px; }

  .keycaps { display: flex; gap: 4px; }
  .keycap {
    font-size: 11px;
    font-weight: 600;
    color: var(--t60);
    background: var(--raised);
    border: 1px solid rgba(255,255,255,.09);
    border-bottom-color: rgba(0,0,0,.55);
    border-radius: 6px;
    padding: 4px 7px;
    min-width: 24px;
    text-align: center;
  }

  .toggle {
    position: relative;
    width: 36px; height: 21px;
    border-radius: 999px;
    background: var(--hover);
    border: 1px solid rgba(255,255,255,.08);
    transition: background 150ms ease-out;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    transition: transform 240ms var(--spring);
  }
  .toggle.on { background: var(--accent); border-color: transparent; }
  .toggle.on::after { transform: translateX(15px); }
  .toggle.off::after { background: rgba(255,255,255,.75); }

  .set-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
  }
  .set-footer p { font-size: 11px; color: var(--t35); }
  .btn-done {
    font-size: 12px;
    font-weight: 600;
    color: #17171b;
    background: var(--white);
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    transition: transform 120ms ease-out;
  }
  .btn-done:hover { transform: translateY(-1px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0s !important;
      animation-duration: 0s !important;
      transform: none !important;
    }
    .toggle.on::after { transform: translateX(15px) !important; }
  }
</style>
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-glyph">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ff8f70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3 L6 14 L10.5 10.5 L13 17 L15.5 16 L13 9.5 L19 9.5 Z"/>
        </svg>
      </div>
      <div class="brand-name">CleanShot W<span>W</span></div>
    </div>

    <nav class="seg-tabs" aria-label="Capture mode">
      <button type="button">Area</button>
      <button type="button" class="on">Edit<span class="dot-edit"></span></button>
      <button type="button">Full</button>
    </nav>

    <div style="display:flex;align-items:center;gap:2px;">
      <button class="icon-btn" type="button" disabled aria-label="Undo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Redo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <div class="icon-sep"></div>
    </div>

    <div class="spacer"></div>

    <div class="sparkline" aria-label="Recent captures" title="Recent captures">
      <i></i><i></i><i></i><i></i><i></i>
    </div>

    <span class="chip-dims"><b>1280</b> × <b>800</b></span>

    <button class="ghost-pill" type="button">OCR</button>
    <button class="ghost-pill" type="button">Pin</button>

    <button class="btn-copy" type="button">Copy</button>
    <button class="ghost-pill" type="button">Save</button>

    <button class="icon-btn" type="button" aria-label="History">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    </button>
    <button class="icon-btn" type="button" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </header>

  <!-- ============ CANVAS ============ -->
  <main class="stage">
    <div class="capture-wrap">
      <div class="capture-card">
        <div class="sel-ring"></div>
        <div class="handle h-tl"></div>
        <div class="handle h-tr"></div>
        <div class="handle h-bl"></div>
        <div class="handle h-br"></div>

        <div class="win-titlebar">
          <span class="tdot r"></span><span class="tdot y"></span><span class="tdot g"></span>
          <span class="win-title">Quarterly Report — Draft.docx</span>
        </div>

        <div class="win-body">
          <aside class="win-side"><i></i><i></i><i></i><i></i><i></i></aside>
          <div class="win-doc">
            <div class="doc-heading"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
            <div class="doc-arrow-gap"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
          </div>
        </div>

        <!-- annotation arrow -->
        <svg class="arrow-layer" viewBox="0 0 560 334" fill="none" aria-hidden="true">
          <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5"
              markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
              <path d="M0.5 0.5 L9.5 5 L0.5 9.5" stroke="#ff8f70" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </marker>
          </defs>
          <path d="M 128 236 C 170 196, 230 178, 296 172"
            stroke="#ff8f70" stroke-width="4" stroke-linecap="round"
            marker-end="url(#arrowhead)"/>
          <circle cx="128" cy="236" r="5.5" fill="#ff8f70"/>
        </svg>

        <div class="counter-badge">1</div>
      </div>
    </div>
  </main>

  <!-- ============ MORPHING CAPSULE DOCK ============ -->
  <div class="dock-zone">
    <div class="dock" role="toolbar" aria-label="Annotation tools">

      <div class="dock-seg">
        <button class="tool on" type="button" aria-label="Select" title="Select">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3 L5 17 L9.2 13.6 L11.8 19.5 L14.4 18.4 L11.9 12.7 L17.5 12.4 Z"/></svg>
        </button>
        <button class="tool" type="button" aria-label="Arrow" title="Arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 L18 6"/><path d="M10 6 H18 V14"/></svg>
        </button>
        <button class="tool" type="button" aria-label="Rectangle" title="Rectangle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
        </button>
        <button class="tool" type="button" aria-label="Ellipse" title="Ellipse">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
        </button>
        <button class="tool" type="button" aria-label="Pen" title="Pen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 C12 3 7 9.5 7 14 a5 5 0 0 0 10 0 C17 9.5 12 3 12 3 Z"/><circle cx="12" cy="14" r="1.6"/></svg>
        </button>
        <button class="tool" type="button" aria-label="Text" title="Text">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6 V4.5 H19 V6"/><path d="M12 4.5 V19.5"/><path d="M9.5 19.5 H14.5"/></svg>
        </button>
        <button class="tool" type="button" aria-label="Counter, next number 2" title="Counter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><text x="12" y="15.4" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="currentColor" stroke="none">2</text></svg>
        </button>
        <button class="tool" type="button" aria-label="Highlighter" title="Highlighter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5 L19.5 10 L10.5 19 L5.5 19.5 L4.5 18.5 L5 13.5 Z"/><path d="M12.5 6 L18 11.5"/></svg>
        </button>

        <div class="dock-divider"></div>

        <button class="tool" type="button" aria-label="Blur" title="Blur">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="4 3"/></svg>
        </button>
        <button class="tool" type="button" aria-label="Pixelate" title="Pixelate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
        </button>
      </div>

      <!-- morphed-out segment B -->
      <div class="dock-divider"></div>
      <div class="dock-seg dock-seg-b">
        <button class="swatch sw-coral sel" type="button" aria-label="Coral, selected"></button>
        <button class="swatch sw-white" type="button" aria-label="White"></button>
        <button class="swatch sw-yellow" type="button" aria-label="Yellow"></button>
        <button class="swatch sw-green" type="button" aria-label="Green"></button>
        <button class="swatch sw-blue" type="button" aria-label="Blue"></button>

        <div class="width-group" role="radiogroup" aria-label="Stroke width">
          <button class="width-dot w-thin" type="button" role="radio" aria-checked="false" aria-label="Thin"><i></i></button>
          <button class="width-dot w-mid" type="button" role="radio" aria-checked="true" aria-label="Medium"><i></i></button>
          <button class="width-dot w-thick" type="button" role="radio" aria-checked="false" aria-label="Thick"><i></i></button>
        </div>
      </div>

    </div>
  </div>

  <!-- ============ SETTINGS PANEL ============ -->
  <aside class="settings" aria-label="Settings">
    <div class="set-header">
      <h2>Settings</h2>
      <p>Everything stays on this device</p>
    </div>

    <div class="set-row">
      <div>
        <div class="row-label">Capture hotkey</div>
        <div class="row-hint">Press anywhere to grab a region</div>
      </div>
      <div class="keycaps">
        <kbd class="keycap">CTRL</kbd>
        <kbd class="keycap">SHIFT</kbd>
        <kbd class="keycap">4</kbd>
      </div>
    </div>

    <div class="set-row">
      <div>
        <div class="row-label">Include cursor</div>
        <div class="row-hint">Show the pointer in captures</div>
      </div>
      <button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="Include cursor"></button>
    </div>

    <div class="set-row">
      <div>
        <div class="row-label">Run at startup</div>
        <div class="row-hint">Launch quietly when Windows starts</div>
      </div>
      <button class="toggle off" type="button" role="switch" aria-checked="false" aria-label="Run at startup"></button>
    </div>

    <div class="set-footer">
      <p>No account · no cloud</p>
      <button class="btn-done" type="button">Done</button>
    </div>
  </aside>

</body>
</html>
