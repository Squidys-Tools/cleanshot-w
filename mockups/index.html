<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanShot W — Editor redesign directions</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0c0d10;
    color: #e8eaee;
    font: 14px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { flex: 0 0 auto; display: flex; align-items: center; gap: 18px; padding: 14px 20px; border-bottom: 1px solid #23262e; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: #8b93a7; font-size: 12px; }
  nav { display: flex; gap: 6px; margin-left: auto; }
  nav button {
    height: 34px; padding: 0 16px; border-radius: 8px; cursor: pointer;
    background: #171a21; border: 1px solid #2a303c; color: #cdd3de;
    font: 600 12px/1 inherit;
  }
  nav button.on { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .frame { flex: 1; min-height: 0; position: relative; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #101216; }
</style>
</head>
<body>
<header>
  <div>
    <h1>CleanShot W · editor + settings redesign</h1>
    <p>Four directions on identical content. Compare the chrome, not the capture.</p>
  </div>
  <nav id="nav"></nav>
</header>
  <div class="frame"><iframe id="view" src="batch3/raycast-jewel.html" title="Direction preview"></iframe></div>
<script>
  const dirs = [
    ["Raycast Jewel", "batch3/raycast-jewel.html", "Blue-tinted near-black ladder · glass bottom dock (blur+saturate) · red-orange accent <8% · white Copy pill · keycap chips"],
    ["Zed Clinical", "batch3/zed-clinical.html", "Warm drafting-gray IDE density · left tool rail with kbd badges · mono labels · right-docked settings · status bar"],
    ["Zed Clinical v2", "batch3/zed-clinical-v2.html", "Same Zed aesthetic, current app topology: top command bar · centered canvas · detached bottom dock with kbd badges · settings popover top-right"],
    ["Alcove Cozy", "batch3/alcove-cozy.html", "Warm dark surfaces · morphing capsule dock with sprung-out style segment · springy toggles · sparkline strip · white pill primary"]
  ];
  const nav = document.getElementById("nav");
  const view = document.getElementById("view");
  for (const [name, file, blurb] of dirs) {
    const b = document.createElement("button");
    b.textContent = name;
    b.title = blurb;
    b.onclick = () => {
      view.src = file;
      [...nav.children].forEach(x => x.classList.toggle("on", x === b));
      location.hash = file.replace(".html", "");
    };
    if (file === "batch3/raycast-jewel.html") b.classList.add("on");
    nav.appendChild(b);
  }
  if (location.hash.length > 1) {
    const f = location.hash.slice(1) + ".html";
    view.src = f;
    [...nav.children].forEach((x, i) => x.classList.toggle("on", dirs[i][1] === f));
  }
</script>
</body>
</html>
