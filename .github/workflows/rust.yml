name: Rust checks

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, and test Rust
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # This action's version ref used to be the only thing Dependabot bumped,
      # which let CI drift onto a toolchain the project never pins or tests: it
      # proposed 1.120.0, which does not exist, and the job failed at setup with
      # a 404 from static.rust-lang.org. Dependabot now ignores this action, so
      # the version below is only ever changed deliberately.
      #
      # `toolchain` must be kept in step with `channel` in rust-toolchain.toml.
      # If you would rather have a single source of truth, drop `toolchain` and
      # let rustup resolve the toolchain file.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
