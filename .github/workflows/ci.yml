name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build frontend
        run: bun run build

      # A production build with no tldraw license key renders a blank editor
      # five seconds after a capture opens. Nothing in the browser suites can
      # see it, because dev builds are exempt. Fail here instead.
      - name: Check tldraw license is configured
        run: bun run check:license
