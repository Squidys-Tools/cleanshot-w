# Builds Snipsy and its standalone editor on windows-2025 and uploads both
# executables for hardware validation.
name: Snipsy Windows build

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-win-build.yml"
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-win-build.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-check:
    # Keeps the Linux x11 dev loop honest: the app must keep compiling and
    # linting clean off-Windows too.
    name: Linux check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app -> target"

      - name: Check formatting
        run: cargo fmt --manifest-path app/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path app/Cargo.toml

      - name: Check compile
        run: cargo check --manifest-path app/Cargo.toml

      - name: No legacy icon packs
        run: node scripts/check-no-legacy-icons.mjs

      - name: Cross-check the Windows cfg code (mingw, check only)
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          cargo check --manifest-path app/Cargo.toml --target x86_64-pc-windows-gnu
          cargo clippy --manifest-path app/Cargo.toml --target x86_64-pc-windows-gnu --all-targets -- -D warnings

  windows-build:
    name: Windows build
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app -> target"

      - name: Run Clippy
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path app/Cargo.toml --all-targets

      - name: Build native app and editor
        run: cargo build --release --bins --manifest-path app/Cargo.toml

      - name: Upload app exe
        uses: actions/upload-artifact@v7
        with:
          name: snipsy-windows
          path: |
            app/target/release/snipsy.exe
            app/target/release/snipsy-editor.exe
          if-no-files-found: error
