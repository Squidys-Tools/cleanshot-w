pre-commit:
  parallel: true
  commands:
    rust-format:
      glob: "src-tauri/**/*.rs"
      run: bun run rust:format
    lockfile-fresh:
      glob: "package.json"
      run: bun install --frozen-lockfile

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
    rust-check:
      run: bun run rust:check
