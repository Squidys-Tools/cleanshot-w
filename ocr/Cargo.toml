[package]
name = "snipsy-ocr-eval"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = "build.rs"

[workspace]
resolver = "2"

[features]
default = ["tesseract"]
tesseract = ["dep:image", "dep:leptess"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"], optional = true }
leptess = { version = "0.14", optional = true }

[target.'cfg(windows)'.dependencies]
futures = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[[bin]]
name = "snipsy-ocr"
path = "src/main.rs"
